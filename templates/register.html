
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Eval</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: Arial, sans-serif;
            background: #f4f6fc; color: #172033;
            min-height: 100vh; display: grid; place-items: center;
            padding: 24px;
        }
        .card {
            width: 100%; max-width: 430px; background: white;
            padding: 36px; border-radius: 18px;
            border: 1px solid #e4e7f0;
        }
        .logo { color: #4f46e5; font-size: 25px; font-weight: bold; }
        h1 { margin-bottom: 8px; font-size: 28px; }
        .muted { color: #64748b; line-height: 1.5; }
        label { display: block; margin: 17px 0 7px; font-weight: 600; }
        input, select {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-size: 15px; background: white;
        }
        button {
            width: 100%; margin-top: 24px; padding: 13px;
            border: 0; border-radius: 8px; background: #4f46e5;
            color: white; font-weight: bold; font-size: 16px; cursor: pointer;
        }
        .message { background: #fff1f2; color: #be123c; padding: 10px; border-radius: 8px; }
        .bottom { margin-top: 22px; text-align: center; color: #64748b; }
        a { color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">Smart Eval</div>
        <h1>Create your account</h1>
        <p class="muted">Get started with intelligent exam evaluation.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="name">Full name</label>
            <input id="name" name="name" required maxlength="100"
                   autocomplete="name" placeholder="Enter your name">

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required
                   maxlength="254" autocomplete="email"
                   placeholder="you@example.com">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" required autocomplete="new-password"
                   placeholder="At least 8 characters">

            <label for="role">I am a</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
            </select>

            <button type="submit">Create Account</button>
        </form>

        <p class="bottom">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
        <p class="bottom"><a href="{{ url_for('home_page') }}">← Back to home</a></p>
    </main>
</body>
</html>
