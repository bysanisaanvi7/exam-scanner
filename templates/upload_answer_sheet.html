
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Answer Sheet | Smart Eval</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
            padding: 30px 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 16px #0000000d;
        }
        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            margin-top: 24px;
            padding: 13px 18px;
            background: #4f46e5;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        a { color: #4f46e5; text-decoration: none; }
        .muted { color: #6b7280; }
    </style>
</head>
<body>
<div class="container">
    <p><a href="{{ url_for('exam_details', exam_id=exam['id']) }}">← Back to Exam</a></p>

    <h1>Upload Answer Sheet</h1>
    <p><strong>Exam:</strong> {{ exam['title'] }}</p>
    <p class="muted">Subject: {{ exam['subject'] }}</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST"
          enctype="multipart/form-data"
          action="{{ url_for('upload_answer_sheet', exam_id=exam['id']) }}">

        <label for="student_email">Student's registered email</label>
        <input type="email" id="student_email" name="student_email"
               required maxlength="254">

        <label for="answer_sheet">Answer sheet (PDF or image, max 10 MB)</label>
        <input type="file" id="answer_sheet" name="answer_sheet"
               accept=".pdf,.png,.jpg,.jpeg,.webp"
               required>

        <button type="submit">Upload Answer Sheet</button>
    </form>
</div>
</body>
</html>
